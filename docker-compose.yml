services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gym}
      POSTGRES_DB: ${POSTGRES_DB:-gym}
    ports:
      # 로컬 개발·테스트용. 운영 서버에서는 외부에 열 필요가 없다.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      # 컨테이너 안에서는 db 서비스 이름으로 접속한다(.env의 localhost 주소를 덮어씀).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gym}:${POSTGRES_PASSWORD:-gym}@db:5432/${POSTGRES_DB:-gym}
      IMAGE_DIR: /data/images
    volumes:
      - images:/data/images
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["bot"]

volumes:
  pgdata:
  images:
